<table class="sg-bpTable">
    <thead>
        <th>Breakpoint</th>
        <th>Class infix</th>
        <th>Dimensions</th>
    </thead>
    <tbody>
        {% for bp in breakpoint  %}
            <tr>
                <td>{{bp.desc}}</th>
                <td><code class="sg-text-code">{{bp.name}}</code></td>

            </tr>
        {% endfor %}
    </tbody>
</table>
